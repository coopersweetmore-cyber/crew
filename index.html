<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The visible title and all copy come from config.js. This fallback is brand-neutral. -->
  <title>Trained young people for local jobs in Cascais</title>
  <meta name="description" content="Cascais households and older neighbours book trained young people aged 16 to 24 for paid local jobs. Launching January 2027.">
  <meta name="theme-color" content="#08392D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500..600,0..1,0&display=block">
  <link rel="preload" as="image" href="assets/hero-dog-walk.jpg">
  <link rel="stylesheet" href="styles.css?v=11">
</head>
<body data-title="meta.titleIndex">

  <a class="skip-link" href="#main" data-t="common.skip"></a>

  <header class="site-header" data-header>
    <div class="container header-inner">
      <a class="logo" href="#main">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
        <span class="logo-text" data-brand></span>
      </a>
      <nav class="site-nav" data-t-aria-label="nav.label">
        <ul>
          <li><a href="#how" data-t="nav.how"></a></li>
          <li><a href="#jobs" data-t="nav.jobs"></a></li>
          <li><a href="#safety" data-t="nav.safety"></a></li>
          <li><a href="#pricing" data-t="nav.pricing"></a></li>
          <li><a href="#faq" data-t="nav.faq"></a></li>
        </ul>
      </nav>
      <div class="header-actions">
        <a class="btn btn-ghost header-demo" href="login.html?v=11">
          <span class="icon" aria-hidden="true">smartphone</span>
          <span data-t="nav.demo"></span>
        </a>
        <a class="btn btn-primary" href="#signup" data-t="nav.signup"></a>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">

    <!-- Hero -->
    <section class="hero">
      <div class="container">
        <div class="hero-grid">
          <div class="hero-copy">
            <h1 class="display" data-t="hero.title"></h1>
            <p class="lead" data-t="hero.intro"></p>

            <div class="starter">
              <div class="segmented" role="tablist" data-tabs data-t-aria-label="hero.tabsLabel">
                <button type="button" role="tab" id="st-tab-family" aria-controls="st-family" aria-selected="true" data-t="hero.tabFamily"></button>
                <button type="button" role="tab" id="st-tab-worker" aria-controls="st-worker" aria-selected="false" tabindex="-1" data-t="hero.tabWorker"></button>
              </div>

              <div class="starter-body" role="tabpanel" id="st-family" aria-labelledby="st-tab-family">
                <p class="starter-line" data-t="hero.familyLine"></p>
                <div class="starter-fields two">
                  <div class="field">
                    <label class="label" for="st-job" data-t="hero.jobLabel"></label>
                    <select class="select" id="st-job" data-options="jobTypes" data-placeholder="hero.jobPlaceholder"></select>
                  </div>
                  <div class="field">
                    <label class="label" for="st-parish-f" data-t="hero.parishLabel"></label>
                    <select class="select" id="st-parish-f" data-options="forms.parishes" data-placeholder="forms.parishPlaceholder"></select>
                  </div>
                </div>
                <button class="btn btn-primary btn-lg btn-block" type="button" data-start="family">
                  <span data-t="hero.start"></span>
                  <span class="icon" aria-hidden="true">arrow_forward</span>
                </button>
              </div>

              <div class="starter-body" role="tabpanel" id="st-worker" aria-labelledby="st-tab-worker" hidden>
                <p class="starter-line" data-t="hero.workerLine"></p>
                <div class="starter-fields two">
                  <div class="field">
                    <label class="label" for="st-age" data-t="hero.ageLabel"></label>
                    <select class="select" id="st-age" data-options="forms.worker.ageOptions" data-placeholder="hero.agePlaceholder"></select>
                  </div>
                  <div class="field">
                    <label class="label" for="st-parish-w" data-t="hero.parishLabel"></label>
                    <select class="select" id="st-parish-w" data-options="forms.parishes" data-placeholder="forms.parishPlaceholder"></select>
                  </div>
                </div>
                <button class="btn btn-primary btn-lg btn-block" type="button" data-start="worker">
                  <span data-t="hero.start"></span>
                  <span class="icon" aria-hidden="true">arrow_forward</span>
                </button>
              </div>

              <p class="starter-meta">
                <span class="icon" aria-hidden="true">event_available</span>
                <span data-t="hero.launch"></span>
              </p>
            </div>
          </div>

          <div class="hero-media">
            <img class="hero-photo" src="assets/hero-dog-walk.jpg" width="1400" height="974" data-t-alt="hero.photoAlt" fetchpriority="high">
            <div class="float-card one" aria-hidden="true">
              <span class="avatar-stack"><span><img src="assets/people/worker-a.jpg" alt="" width="34" height="34"></span><span><img src="assets/people/worker-b.jpg" alt="" width="34" height="34"></span><span><img src="assets/people/worker-c.jpg" alt="" width="34" height="34"></span></span>
              <span><strong data-t="hero.chipShortlistTitle"></strong><span class="small" data-t="hero.chipShortlistText"></span></span>
            </div>
            <div class="float-card two" aria-hidden="true">
              <span class="medal-sm"><span class="icon icon-fill">workspace_premium</span></span>
              <span><strong data-t="hero.chipBadgeTitle"></strong><span class="small" data-t="hero.chipBadgeText"></span></span>
            </div>
            <p class="preview-label" data-t="hero.previewLabel"></p>
          </div>
        </div>

        <ul class="trust" data-list="hero.trust">
          <template>
            <li><span class="icon" data-f="icon" aria-hidden="true"></span><span data-f="text"></span></li>
          </template>
        </ul>
      </div>
    </section>

    <!-- How it works -->
    <section id="how" class="section">
      <div class="container how-grid">
        <div class="how-steps">
          <div class="section-head flush">
            <h2 class="h2" data-t="how.title"></h2>
            <p class="lead" data-t="how.intro"></p>
          </div>
          <div class="segmented" role="tablist" data-tabs data-how-tabs data-t-aria-label="how.tabsLabel">
            <button type="button" role="tab" id="how-tab-family" aria-controls="how-family" aria-selected="true" data-demo="family.html?v=11&embed=1" data-t="how.tabFamily"></button>
            <button type="button" role="tab" id="how-tab-worker" aria-controls="how-worker" aria-selected="false" tabindex="-1" data-demo="worker.html?v=11&embed=1" data-t="how.tabWorker"></button>
          </div>
          <p class="steps-hint"><span class="icon" aria-hidden="true">touch_app</span><span data-t="how.stepsHint"></span></p>
          <div role="tabpanel" id="how-family" aria-labelledby="how-tab-family">
            <ol class="steps" data-list="how.familySteps">
              <template>
                <li><button type="button" class="step" aria-pressed="false" data-f-attr="data-screen:screen"><span class="step-n num" data-f="index" aria-hidden="true"></span><span class="step-body"><span class="step-title" data-f="title"></span><span class="step-text" data-f="text"></span></span></button></li>
              </template>
            </ol>
            <div class="how-cta">
              <a class="btn btn-primary" href="#family" data-t="how.familyCta"></a>
            </div>
          </div>
          <div role="tabpanel" id="how-worker" aria-labelledby="how-tab-worker" hidden>
            <ol class="steps" data-list="how.workerSteps">
              <template>
                <li><button type="button" class="step" aria-pressed="false" data-f-attr="data-screen:screen"><span class="step-n num" data-f="index" aria-hidden="true"></span><span class="step-body"><span class="step-title" data-f="title"></span><span class="step-text" data-f="text"></span></span></button></li>
              </template>
            </ol>
            <div class="how-cta">
              <a class="btn btn-primary" href="#worker" data-t="how.workerCta"></a>
            </div>
          </div>
        </div>

        <aside class="demo-panel on-dark">
          <div class="demo-panel-head">
            <h3 class="h3" data-t="how.demoTitle"></h3>
            <p data-t="how.demoText"></p>
          </div>
          <div class="device">
            <iframe src="family.html?v=11&embed=1" loading="lazy" data-demo-frame data-t-title="how.demoFrameTitle"></iframe>
          </div>
          <a class="btn btn-sun" href="login.html?v=11">
            <span class="icon" aria-hidden="true">open_in_full</span>
            <span data-t="how.demoOpen"></span>
          </a>
        </aside>
      </div>
    </section>

    <!-- Job types -->
    <section id="jobs" class="section section-mist">
      <div class="container">
        <div class="section-head">
          <h2 class="h2" data-t="jobs.title"></h2>
          <p class="lead" data-t="jobs.intro"></p>
        </div>
        <ul class="job-grid" data-list="jobTypes">
          <template>
            <li class="job-card">
              <img src="assets/job-events.jpg" alt="" loading="lazy" width="900" height="600" data-f-attr="src:photo;alt:alt">
              <div class="job-card-body">
                <h3><span class="icon" data-f="icon" aria-hidden="true"></span><span data-f="name"></span></h3>
                <p data-f="desc"></p>
                <a class="job-link" href="#family" data-f-attr="data-job:value"><span data-t="jobs.cardCta"></span><span class="icon" aria-hidden="true">chevron_right</span></a>
              </div>
            </li>
          </template>
        </ul>
        <p class="job-note"><span class="icon" aria-hidden="true">info</span><span data-t="jobs.notOffered"></span></p>
      </div>
    </section>

    <!-- Safety and insurance -->
    <section id="safety" class="section safety on-dark">
      <div class="container safety-grid">
        <div class="safety-head">
          <h2 class="h2" data-t="safety.title"></h2>
          <p class="lead" data-t="safety.intro"></p>
        </div>
        <ul class="safety-list" data-list="safety.items">
          <template>
            <li><span class="ico"><span class="icon" data-f="icon" aria-hidden="true"></span></span><div><h3 data-f="title"></h3><p data-f="text"></p></div></li>
          </template>
        </ul>
      </div>
    </section>

    <!-- Skills and badges -->
    <section id="skills" class="section">
      <div class="container skills-grid">
        <div class="skills-copy">
          <h2 class="h2" data-t="skills.title"></h2>
          <p class="lead" data-t="skills.intro"></p>
          <div class="survey-quote">
            <p class="lead-in" data-t="skills.surveyLead"></p>
            <p class="q" data-survey></p>
          </div>
        </div>
        <div class="record-card">
          <div>
            <h3 data-t="skills.badgesTitle"></h3>
            <ul class="badge-row" data-list="jobTypes">
              <template>
                <li><span class="medal"><span class="icon" data-f="icon" aria-hidden="true"></span></span><span data-f="short"></span></li>
              </template>
            </ul>
          </div>
          <div>
            <h3 data-t="skills.levelsTitle"></h3>
            <ol class="level-track" data-list="levels">
              <template>
                <li><span class="lvl" data-f="index" aria-hidden="true"></span><div><h4 data-f="name"></h4><p><span data-f="rule"></span> <b data-t="skills.unlocks"></b>: <span data-f="unlocks"></span></p></div></li>
              </template>
            </ol>
          </div>
        </div>
      </div>
    </section>

    <!-- Pricing -->
    <section id="pricing" class="section section-mist">
      <div class="container">
        <div class="section-head">
          <h2 class="h2" data-t="pricing.title"></h2>
          <p class="lead" data-t="pricing.intro"></p>
        </div>
        <div class="pricing-grid">
          <div class="offer">
            <div class="offer-top">
              <h3><span class="icon icon-fill" aria-hidden="true">star</span><span data-t="pricing.offerTitle"></span></h3>
              <p data-t="pricing.offerText"></p>
            </div>
            <div class="receipt">
              <h4 data-t="pricing.exampleTitle"></h4>
              <p class="receipt-row"><span data-t="pricing.exampleRate"></span><span class="num" data-t="pricing.exampleRateValue"></span></p>
              <p class="receipt-row is-struck"><span data-t="pricing.exampleFee"></span><del class="num" data-t="pricing.exampleFeeValue"></del></p>
              <p class="receipt-row"><span data-t="pricing.exampleFounding"></span><span class="num" data-t="pricing.exampleFoundingValue"></span></p>
              <p class="receipt-row is-total"><span data-t="pricing.exampleTotal"></span><span class="num" data-t="pricing.exampleTotalValue"></span></p>
              <p class="receipt-foot"><span class="icon" aria-hidden="true">check_circle</span><span data-t="pricing.exampleWorker"></span></p>
            </div>
          </div>
          <ul class="price-points" data-list="pricing.points">
            <template>
              <li class="price-point"><span class="ico"><span class="icon" data-f="icon" aria-hidden="true"></span></span><div><h3 data-f="title"></h3><p data-f="text"></p></div></li>
            </template>
          </ul>
        </div>
      </div>
    </section>

    <!-- Sign-up forms -->
    <section id="signup" class="section">
      <div class="container">
        <div class="section-head center">
          <h2 class="h2" data-t="signup.title"></h2>
          <p class="lead" data-t="signup.intro"></p>
        </div>

        <div class="signup-wrap">
          <div class="segmented" role="tablist" data-tabs data-signup-tabs data-t-aria-label="signup.tabsLabel">
            <button type="button" role="tab" id="su-tab-family" aria-controls="su-family" aria-selected="true" data-t="signup.tabFamily"></button>
            <button type="button" role="tab" id="su-tab-worker" aria-controls="su-worker" aria-selected="false" tabindex="-1" data-t="signup.tabWorker"></button>
          </div>

          <div role="tabpanel" id="su-family" aria-labelledby="su-tab-family">
            <form id="family" class="form-card" data-form="family" novalidate>
              <div class="form-card-head">
                <h3 class="h3" data-t="forms.family.title"></h3>
                <p data-t="forms.family.intro"></p>
              </div>

              <div class="form-fields" data-fields>
                <div class="field" data-rule="required">
                  <label class="label" for="f-name" data-t="forms.family.name"></label>
                  <input class="input" id="f-name" name="name" type="text" autocomplete="name">
                  <p class="field-error"></p>
                </div>

                <div class="field-row">
                  <div class="field" data-rule="email">
                    <label class="label" for="f-email" data-t="forms.family.email"></label>
                    <input class="input" id="f-email" name="email" type="email" autocomplete="email" inputmode="email">
                    <p class="field-error"></p>
                  </div>
                  <div class="field">
                    <label class="label" for="f-phone" data-t="forms.family.phone"></label>
                    <input class="input" id="f-phone" name="phone" type="tel" autocomplete="tel">
                  </div>
                </div>

                <div class="field" data-rule="required">
                  <label class="label" for="f-parish" data-t="forms.family.parish"></label>
                  <select class="select" id="f-parish" name="parish" data-options="forms.parishes" data-placeholder="forms.parishPlaceholder"></select>
                  <p class="field-error"></p>
                </div>

                <fieldset class="field" data-rule="many">
                  <legend data-t="forms.family.jobs"></legend>
                  <p class="hint" data-t="forms.chooseAll"></p>
                  <div class="choices" data-choices="jobTypes" data-name="jobs" data-type="checkbox"></div>
                  <p class="field-error"></p>
                </fieldset>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.family.frequency"></legend>
                  <div class="choices" data-choices="forms.family.frequencyOptions" data-name="frequency"></div>
                  <p class="field-error"></p>
                </fieldset>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.family.fee"></legend>
                  <div class="choices" data-choices="forms.family.feeOptions" data-name="booking_fee"></div>
                  <p class="field-error"></p>
                </fieldset>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.family.rate"></legend>
                  <div class="choices" data-choices="forms.family.rateOptions" data-name="fair_rate"></div>
                  <p class="field-error"></p>
                </fieldset>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.family.payment"></legend>
                  <div class="choices" data-choices="forms.family.paymentOptions" data-name="payment"></div>
                  <p class="field-error"></p>
                </fieldset>

                <div class="field" data-rule="consent">
                  <label class="consent">
                    <input type="checkbox" name="consent" value="Yes">
                    <span data-t="forms.family.consent"></span>
                  </label>
                  <p class="field-error"></p>
                </div>

                <div aria-live="polite"><div data-status hidden></div></div>

                <button class="btn btn-primary btn-lg btn-block" type="submit">
                  <span data-t="forms.family.submit"></span>
                </button>
              </div>

              <div class="notice notice-success" data-success tabindex="-1" hidden>
                <span class="icon icon-fill" aria-hidden="true">check_circle</span>
                <span data-t="forms.family.success"></span>
              </div>
            </form>
          </div>

          <div role="tabpanel" id="su-worker" aria-labelledby="su-tab-worker" hidden>
            <form id="worker" class="form-card" data-form="worker" novalidate>
              <div class="form-card-head">
                <h3 class="h3" data-t="forms.worker.title"></h3>
                <p data-t="forms.worker.intro"></p>
              </div>

              <div class="form-fields" data-fields>
                <div class="field-row">
                  <div class="field" data-rule="required">
                    <label class="label" for="w-name" data-t="forms.worker.name"></label>
                    <input class="input" id="w-name" name="name" type="text" autocomplete="name">
                    <p class="field-error"></p>
                  </div>
                  <div class="field" data-rule="email">
                    <label class="label" for="w-email" data-t="forms.worker.email"></label>
                    <input class="input" id="w-email" name="email" type="email" autocomplete="email" inputmode="email">
                    <p class="field-error"></p>
                  </div>
                </div>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.worker.age"></legend>
                  <div class="choices" data-choices="forms.worker.ageOptions" data-name="age_band"></div>
                  <p class="field-error"></p>
                </fieldset>

                <div aria-live="polite">
                  <div class="notice notice-info" data-under16 hidden>
                    <span class="icon" aria-hidden="true">info</span>
                    <span data-t="forms.worker.under16"></span>
                  </div>
                </div>

                <div class="field" data-rule="email" data-parent-field hidden>
                  <label class="label" for="w-parent" data-t="forms.worker.parentEmail"></label>
                  <p class="hint" id="w-parent-hint" data-t="forms.worker.parentHint"></p>
                  <input class="input" id="w-parent" name="parent_email" type="email" autocomplete="off" inputmode="email" aria-describedby="w-parent-hint" disabled>
                  <p class="field-error"></p>
                </div>

                <div class="field" data-rule="required">
                  <label class="label" for="w-school" data-t="forms.worker.school"></label>
                  <p class="hint" id="w-school-hint" data-t="forms.worker.schoolHint"></p>
                  <input class="input" id="w-school" name="school" type="text" aria-describedby="w-school-hint">
                  <p class="field-error"></p>
                </div>

                <div class="field" data-rule="required">
                  <label class="label" for="w-parish" data-t="forms.worker.parish"></label>
                  <select class="select" id="w-parish" name="parish" data-options="forms.parishes" data-placeholder="forms.parishPlaceholder"></select>
                  <p class="field-error"></p>
                </div>

                <fieldset class="field" data-rule="many">
                  <legend data-t="forms.worker.jobs"></legend>
                  <p class="hint" data-t="forms.chooseAll"></p>
                  <div class="choices" data-choices="jobTypes" data-name="jobs" data-type="checkbox"></div>
                  <p class="field-error"></p>
                </fieldset>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.worker.hours"></legend>
                  <div class="choices" data-choices="forms.worker.hoursOptions" data-name="hours_per_week"></div>
                  <p class="field-error"></p>
                </fieldset>

                <fieldset class="field" data-rule="one">
                  <legend data-t="forms.worker.bank"></legend>
                  <div class="choices" data-choices="forms.worker.bankOptions" data-name="pt_bank_account"></div>
                  <p class="field-error"></p>
                </fieldset>

                <div class="field" data-rule="consent">
                  <label class="consent">
                    <input type="checkbox" name="consent" value="Yes">
                    <span data-t="forms.worker.consent"></span>
                  </label>
                  <p class="field-error"></p>
                </div>

                <div aria-live="polite"><div data-status hidden></div></div>

                <button class="btn btn-dark btn-lg btn-block" type="submit">
                  <span data-t="forms.worker.submit"></span>
                </button>
              </div>

              <div class="notice notice-success" data-success tabindex="-1" hidden>
                <span class="icon icon-fill" aria-hidden="true">check_circle</span>
                <span data-t="forms.worker.success"></span>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <!-- FAQ -->
    <section id="faq" class="section section-mist">
      <div class="container faq-grid">
        <div class="faq-head">
          <h2 class="h2" data-t="faq.title"></h2>
          <p class="lead" data-t="faq.intro" data-needs-email></p>
        </div>
        <div class="faq-list" data-list="faq.items">
          <template>
            <details>
              <summary><span data-f="q"></span><span class="icon" aria-hidden="true">add</span></summary>
              <p data-f="a"></p>
            </details>
          </template>
        </div>
      </div>
    </section>

  </main>

  <footer class="site-footer on-dark">
    <div class="container footer-inner">
      <div class="footer-brand">
        <a class="logo" href="#main">
          <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0E7258"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
          <span class="logo-text" data-brand></span>
        </a>
        <p data-t="footer.project"></p>
        <p data-needs-email><span data-t="footer.contact"></span> <span data-email></span></p>
      </div>
      <nav class="footer-links" data-t-aria-label="footer.nav">
        <a href="#how" data-t="nav.how"></a>
