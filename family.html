<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App demo: family</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFC83D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500..600,0..1,0&display=block">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="app-page" data-title="meta.titleFamily" data-app="family">

  <a class="skip-link" href="#main" data-t="common.skip"></a>

  <div class="demo-banner" role="note">
    <span class="icon" aria-hidden="true">science</span>
    <span data-t="common.demoBanner"></span>
  </div>

  <div class="app-stage">
    <div class="stage-copy leave-demo">
      <a class="logo" href="index.html">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
        <span class="logo-text" data-brand></span>
      </a>
      <h1 class="h2" data-t="demo.stageTitle"></h1>
      <p class="lead" data-t="demo.stageText"></p>
      <div class="try">
        <h2 class="try-title" data-t="demo.tryTitle"></h2>
        <ol class="try-list" data-list="demo.tryFamily">
          <template><li><span class="try-num" data-f="index" aria-hidden="true"></span><span data-f-self></span></li></template>
        </ol>
      </div>
      <div class="stage-switch">
        <p data-t="demo.switchLabel"></p>
        <nav data-t-aria-label="demo.switchLabel">
          <a href="family.html" aria-current="page" data-t="demo.familyView"></a>
          <a href="worker.html" data-t="demo.workerView"></a>
        </nav>
      </div>
      <a class="btn btn-outline" href="index.html">
        <span class="icon" aria-hidden="true">arrow_back</span>
        <span data-t="common.backToSite"></span>
      </a>
    </div>

    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true">
          <span data-t="demo.statusTime"></span>
          <span class="notch"></span>
          <span class="sys"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span>
        </div>

        <main id="main" class="app-body" tabindex="-1" data-app-body>

          <!-- Post a job -->
          <section class="screen" data-screen="post" data-tab="post">
            <div class="app-top">
              <a class="logo" href="index.html" data-keep-embed>
                <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
                <span class="logo-text" data-brand></span>
              </a>
              <span class="pill pill-sun"><span class="icon icon-fill" aria-hidden="true">star</span><span data-t="demo.family.founding"></span></span>
            </div>
            <div class="screen-head">
              <h2 class="app-title" tabindex="-1" data-focus data-hello></h2>
              <p class="app-sub" data-t="demo.family.postIntro"></p>
            </div>

            <form id="post-job" class="form-fields" novalidate>
              <fieldset class="field" data-rule="one">
                <legend data-t="demo.family.job"></legend>
                <div class="job-tiles" data-job-tiles></div>
                <p class="field-error"></p>
              </fieldset>
              <div class="field" data-rule="required">
                <label class="label" for="p-parish" data-t="demo.family.parish"></label>
                <select class="select" id="p-parish" name="parish" data-options="forms.parishes" data-placeholder="forms.parishPlaceholder"></select>
                <p class="field-error"></p>
              </div>
              <div class="field-row">
                <div class="field" data-rule="required">
                  <label class="label" for="p-date" data-t="demo.family.date"></label>
                  <select class="select" id="p-date" name="date"></select>
                  <p class="field-error"></p>
                </div>
                <div class="field" data-rule="required">
                  <label class="label" for="p-time" data-t="demo.family.time"></label>
                  <select class="select" id="p-time" name="time"></select>
                  <p class="field-error"></p>
                </div>
              </div>
              <div class="field">
                <span class="label" id="p-hours-label" data-t="demo.family.hours"></span>
                <div class="stepper" role="group" aria-labelledby="p-hours-label">
                  <button type="button" data-step="-1" aria-label="−"><span class="icon" aria-hidden="true">remove</span></button>
                  <output id="p-hours-out" aria-live="polite"></output>
                  <button type="button" data-step="1" aria-label="+"><span class="icon" aria-hidden="true">add</span></button>
                </div>
                <input type="hidden" name="hours" id="p-hours" value="2">
              </div>
              <div class="field">
                <label class="label" for="p-notes" data-t="demo.family.notes"></label>
                <textarea class="textarea" id="p-notes" name="notes" rows="2"></textarea>
              </div>
              <button class="btn btn-primary btn-lg btn-block" type="submit">
                <span class="icon" aria-hidden="true">search</span>
                <span data-t="demo.family.submit"></span>
              </button>
            </form>
          </section>

          <!-- Shortlist -->
          <section class="screen" data-screen="shortlist" data-tab="post" hidden>
            <div class="app-top">
              <button class="icon-btn" type="button" data-go="post" data-back data-t-aria-label="demo.back"><span class="icon" aria-hidden="true">arrow_back</span></button>
            </div>
            <div class="screen-head">
              <h2 class="app-title" tabindex="-1" data-focus data-t="demo.family.shortlistTitle"></h2>
              <p class="app-sub" data-shortlist-intro></p>
            </div>
            <p class="notice notice-info" data-late-note hidden>
              <span class="icon" aria-hidden="true">bedtime</span>
              <span data-t="demo.family.lateNote"></span>
            </p>
            <div class="stack" data-shortlist></div>
          </section>

          <!-- Confirmation -->
          <section class="screen" data-screen="confirm" data-tab="post" hidden>
            <div class="app-top">
              <button class="icon-btn" type="button" data-go="shortlist" data-back data-t-aria-label="demo.back"><span class="icon" aria-hidden="true">arrow_back</span></button>
            </div>
            <div class="screen-head">
              <span class="success-mark"><span class="icon icon-fill" aria-hidden="true">check_circle</span></span>
              <h2 class="app-title" tabindex="-1" data-focus data-t="demo.family.confirmTitle"></h2>
              <p class="app-sub" data-confirm-intro></p>
            </div>
            <div class="app-card mist">
              <dl class="summary-list">
                <dt data-t="demo.family.summaryJob"></dt><dd data-sum-job></dd>
                <dt data-t="demo.family.summaryWhen"></dt><dd data-sum-when></dd>
                <dt data-t="demo.family.summaryWhere"></dt><dd data-sum-where></dd>
              </dl>
            </div>
            <div class="app-card app-receipt">
              <p class="receipt-row"><span data-rate-line></span><span class="num" data-rate-value></span></p>
              <p class="receipt-row is-struck"><span data-t="demo.family.feeLine"></span><del class="num" data-fee-value></del></p>
              <p class="receipt-row"><span data-t="demo.family.foundingLine"></span><span class="num" data-founding-value></span></p>
              <p class="receipt-row is-total"><span data-t="demo.family.total"></span><span class="num" data-total-value></span></p>
            </div>
            <p class="note-row"><span class="icon" aria-hidden="true">verified_user</span><span data-t="demo.family.insured"></span></p>
            <p class="note-row"><span class="icon" aria-hidden="true">payments</span><span data-worker-keeps></span></p>
            <p class="note-row"><span class="icon" aria-hidden="true">star</span><span data-t="demo.family.foundingNote"></span></p>
            <button class="btn btn-primary btn-lg btn-block" type="button" data-go="bookings" data-t="demo.family.done"></button>
            <button class="btn btn-outline btn-block" type="button" data-go="shortlist" data-back data-t="demo.family.changeWorker"></button>
          </section>

          <!-- Bookings -->
          <section class="screen" data-screen="bookings" data-tab="bookings" hidden>
            <div class="app-top"><h2 class="app-title" tabindex="-1" data-focus data-t="demo.family.bookingsTitle"></h2></div>
            <div data-bookings></div>
          </section>

          <!-- Account -->
          <section class="screen" data-screen="account" data-tab="account" hidden>
            <div class="app-top"><h2 class="app-title" tabindex="-1" data-focus data-t="demo.family.accountTitle"></h2></div>
            <div class="app-card">
              <div class="worker-top">
                <span class="avatar" aria-hidden="true"><span class="icon">home</span></span>
                <div><p class="worker-name" data-family-name></p><p class="app-sub" data-family-parish></p></div>
              </div>
            </div>
            <div class="app-card mist">
              <h3><span class="pill pill-sun"><span class="icon icon-fill" aria-hidden="true">star</span><span data-t="demo.family.founding"></span></span></h3>
              <p class="app-sub" data-t="demo.family.foundingText"></p>
            </div>
            <a class="btn btn-outline btn-block" href="worker.html" data-keep-embed>
              <span class="icon" aria-hidden="true">swap_horiz</span><span data-t="demo.family.switchToWorker"></span>
            </a>
            <a class="btn btn-ghost btn-block" href="login.html" data-keep-embed>
              <span class="icon" aria-hidden="true">logout</span><span data-t="demo.logout"></span>
            </a>
          </section>
        </main>

        <nav class="tabbar" data-tabbar data-t-aria-label="demo.tabsLabel">
          <button type="button" data-go="post" data-tab-btn="post"><span class="icon" aria-hidden="true">add_circle</span><span data-t="demo.family.tabHome"></span></button>
          <button type="button" data-go="bookings" data-tab-btn="bookings"><span class="icon" aria-hidden="true">event</span><span data-t="demo.family.tabBookings"></span></button>
          <button type="button" data-go="account" data-tab-btn="account"><span class="icon" aria-hidden="true">person</span><span data-t="demo.family.tabAccount"></span></button>
        </nav>
      </div>
    </div>
  </div>

  <script src="config.js?v=4"></script>
  <script src="demo-data.js?v=4"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
