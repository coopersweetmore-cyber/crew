<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App demo: log in</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFC83D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500..600,0..1,0&display=block">
  <!-- Pick the layout before the page draws: embedded phone, phone view, or website. -->
  <script>(function (s, c) { c.add(/[?&]embed=1\b/.test(s) ? "is-embed" : /[?&]view=phone\b/.test(s) ? "is-phone" : "is-web"); })(window.location.search, document.documentElement.classList);</script>
  <link rel="stylesheet" href="styles.css?v=22">
</head>
<body class="app-page login-page" data-title="meta.titleLogin">

  <a class="skip-link" href="#main" data-t="common.skip"></a>

  <div class="demo-banner" role="note">
    <span class="icon" aria-hidden="true">science</span>
    <span data-t="common.demoBanner"></span>
  </div>

  <!-- Website layout (laptops and tablets): top bar instead of the phone frame. -->
  <header class="web-head">
    <div class="web-head-inner">
      <a class="logo" href="index.html"><svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg><span class="logo-text" data-brand></span></a>
      <div class="web-head-end">
        <a class="web-link" href="?view=phone" data-view-toggle><span class="icon" aria-hidden="true">smartphone</span><span class="web-label" data-t="demo.phoneView"></span></a>
        <a class="web-link web-link-strong" href="index.html"><span class="icon" aria-hidden="true">arrow_back</span><span class="web-label" data-t="common.backToSite"></span></a>
      </div>
    </div>
  </header>

  <div class="app-stage">
    <div class="stage-copy leave-demo">
      <a class="logo" href="index.html">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
        <span class="logo-text" data-brand></span>
      </a>
      <h1 class="h2" data-t="demo.stageTitle"></h1>
      <p class="lead" data-t="demo.stageText"></p>
      <div class="try">
        <h2 class="try-title" data-t="demo.tryTitle"></h2>
        <ol class="try-list" data-list="demo.tryLogin">
          <template><li><span class="try-num" data-f="index" aria-hidden="true"></span><span data-f-self></span></li></template>
        </ol>
      </div>
      <div class="stage-switch">
        <p data-t="demo.switchLabel"></p>
        <nav data-t-aria-label="demo.switchLabel">
          <a href="family.html?v=22" data-t="demo.familyView"></a>
          <a href="worker.html?v=22" data-t="demo.workerView"></a>
        </nav>
      </div>
      <a class="btn btn-primary" href="?" data-view-toggle>
        <span class="icon" aria-hidden="true">desktop_windows</span>
        <span data-t="demo.webView"></span>
      </a>
      <a class="btn btn-outline" href="index.html">
        <span class="icon" aria-hidden="true">arrow_back</span>
        <span data-t="common.backToSite"></span>
      </a>
    </div>

    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true">
          <span data-t="demo.statusTime"></span>
          <span class="notch"></span>
          <span class="sys"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span>
        </div>

        <main id="main" class="app-body" tabindex="-1">
          <div class="login-screen">
            <div class="login-mark">
              <a class="logo" href="index.html">
                <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
                <span class="logo-text" data-brand></span>
              </a>
              <div class="screen-head">
                <h2 class="app-title" data-t="demo.login.welcome"></h2>
                <p class="app-sub" data-t="demo.login.intro"></p>
              </div>
            </div>

            <!-- Fake login: the email and password inputs have no name, so nothing is sent or saved. -->
            <form id="login-form" class="form-fields" novalidate>
              <fieldset class="field">
                <legend data-t="demo.login.roleLegend"></legend>
                <div class="segmented">
                  <label><input type="radio" name="role" value="family" checked><span data-t="demo.login.roleFamily"></span></label>
                  <label><input type="radio" name="role" value="worker"><span data-t="demo.login.roleWorker"></span></label>
                </div>
              </fieldset>

              <div class="field">
                <label class="label" for="l-email" data-t="demo.login.email"></label>
                <input class="input" id="l-email" type="email" autocomplete="off" inputmode="email">
              </div>

              <div class="field">
                <label class="label" for="l-pass" data-t="demo.login.password"></label>
                <div class="pass-wrap">
                  <input class="input" id="l-pass" type="password" autocomplete="off">
                  <button class="pass-toggle" type="button" aria-controls="l-pass" aria-pressed="false" data-pass-toggle data-t="demo.login.show"></button>
                </div>
              </div>

              <button class="btn btn-primary btn-lg btn-block" type="submit">
                <span data-t="demo.login.submit"></span>
              </button>
              <p class="note-row"><span class="icon" aria-hidden="true">lock</span><span data-t="demo.login.note"></span></p>
            </form>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="config.js?v=22"></script>
  <script src="script.js?v=22"></script>
</body>
</html>
