<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>App demo: worker</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#FFC83D">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500..600,0..1,0&display=block">
  <link rel="stylesheet" href="styles.css?v=4">
</head>
<body class="app-page" data-title="meta.titleWorker" data-app="worker">

  <a class="skip-link" href="#main" data-t="common.skip"></a>

  <div class="demo-banner" role="note">
    <span class="icon" aria-hidden="true">science</span>
    <span data-t="common.demoBanner"></span>
  </div>

  <div class="app-stage">
    <div class="stage-copy leave-demo">
      <a class="logo" href="index.html">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
        <span class="logo-text" data-brand></span>
      </a>
      <h1 class="h2" data-t="demo.stageTitle"></h1>
      <p class="lead" data-t="demo.stageText"></p>
      <div class="try">
        <h2 class="try-title" data-t="demo.tryTitle"></h2>
        <ol class="try-list" data-list="demo.tryWorker">
          <template><li><span class="try-num" data-f="index" aria-hidden="true"></span><span data-f-self></span></li></template>
        </ol>
      </div>
      <div class="stage-switch">
        <p data-t="demo.switchLabel"></p>
        <nav data-t-aria-label="demo.switchLabel">
          <a href="family.html" data-t="demo.familyView"></a>
          <a href="worker.html" aria-current="page" data-t="demo.workerView"></a>
        </nav>
      </div>
      <a class="btn btn-outline" href="index.html">
        <span class="icon" aria-hidden="true">arrow_back</span>
        <span data-t="common.backToSite"></span>
      </a>
    </div>

    <div class="phone">
      <div class="phone-screen">
        <div class="status-bar" aria-hidden="true">
          <span data-t="demo.statusTime"></span>
          <span class="notch"></span>
          <span class="sys"><span class="icon">signal_cellular_alt</span><span class="icon">wifi</span><span class="icon">battery_full</span></span>
        </div>

        <main id="main" class="app-body" tabindex="-1" data-app-body>

          <!-- Home -->
          <section class="screen" data-screen="home" data-tab="home">
            <div class="app-top">
              <a class="logo" href="index.html" data-keep-embed>
                <svg viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#0B5D4A"/><path d="M27.5 13.8a9.2 9.2 0 1 0 0 12.4" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round"/><circle cx="29.6" cy="20" r="3.3" fill="#FFC83D"/></svg>
                <span class="logo-text" data-brand></span>
              </a>
              <span class="avatar" aria-hidden="true" data-initials></span>
            </div>
            <h2 class="app-title" tabindex="-1" data-focus data-hello></h2>

            <div class="app-card level-hero on-dark">
              <p class="on-green" id="lvl-title" data-t="demo.worker.levelTitle"></p>
              <p class="level-name" data-level-now></p>
              <div class="progress" role="progressbar" aria-labelledby="lvl-title" aria-valuemin="0" data-progress><div class="progress-fill"></div></div>
              <p data-level-progress></p>
              <ul class="level-steps" data-level-steps></ul>
            </div>

            <div class="app-card">
              <h3 data-t="demo.worker.earningsTitle"></h3>
              <p class="earn-num num" data-earnings></p>
              <p class="app-sub"><span data-month></span>. <span data-earnings-note></span></p>
            </div>

            <div class="app-card">
              <h3 data-t="demo.worker.upcomingTitle"></h3>
              <ul class="app-list" data-upcoming></ul>
            </div>
          </section>

          <!-- Badges -->
          <section class="screen" data-screen="badges" data-tab="badges" hidden>
            <div class="screen-head pad-top">
              <h2 class="app-title" tabindex="-1" data-focus data-t="demo.worker.badgesTitle"></h2>
              <p class="app-sub" data-t="demo.worker.badgesIntro"></p>
            </div>
            <ul class="badge-grid" data-badges></ul>
          </section>

          <!-- Skills record -->
          <section class="screen" data-screen="record" data-tab="record" hidden>
            <div class="screen-head pad-top">
              <h2 class="app-title" tabindex="-1" data-focus data-t="demo.worker.recordTitle"></h2>
              <p class="app-sub" data-t="demo.worker.recordIntro"></p>
            </div>
            <div class="app-card">
              <table class="app-table">
                <thead><tr>
                  <th scope="col" data-t="demo.worker.colSkill"></th>
                  <th scope="col" data-t="demo.worker.colJobs"></th>
                  <th scope="col" data-t="demo.worker.colRating"></th>
                  <th scope="col" data-t="demo.worker.colPassed"></th>
                </tr></thead>
                <tbody data-skills></tbody>
              </table>
            </div>
            <p class="note-row"><span class="icon" aria-hidden="true">description</span><span data-t="demo.worker.reference"></span></p>
          </section>

          <!-- Account -->
          <section class="screen" data-screen="account" data-tab="account" hidden>
            <div class="screen-head pad-top">
              <h2 class="app-title" tabindex="-1" data-focus data-t="demo.worker.accountTitle"></h2>
            </div>
            <div class="app-card">
              <div class="worker-top">
                <span class="avatar" aria-hidden="true" data-initials></span>
                <div><p class="worker-name" data-worker-name></p><p class="app-sub"><span data-t="demo.worker.ageBand"></span>: <span data-age-band></span></p></div>
              </div>
            </div>
            <p class="note-row"><span class="icon" aria-hidden="true">family_restroom</span><span data-t="demo.worker.consentNote"></span></p>
            <a class="btn btn-outline btn-block" href="family.html" data-keep-embed>
              <span class="icon" aria-hidden="true">swap_horiz</span><span data-t="demo.worker.switchToFamily"></span>
            </a>
            <a class="btn btn-ghost btn-block" href="login.html" data-keep-embed>
              <span class="icon" aria-hidden="true">logout</span><span data-t="demo.logout"></span>
            </a>
          </section>
        </main>

        <nav class="tabbar" data-tabbar data-t-aria-label="demo.tabsLabel">
          <button type="button" data-go="home" data-tab-btn="home"><span class="icon" aria-hidden="true">home</span><span data-t="demo.worker.tabHome"></span></button>
          <button type="button" data-go="badges" data-tab-btn="badges"><span class="icon" aria-hidden="true">workspace_premium</span><span data-t="demo.worker.tabBadges"></span></button>
          <button type="button" data-go="record" data-tab-btn="record"><span class="icon" aria-hidden="true">assignment</span><span data-t="demo.worker.tabRecord"></span></button>
          <button type="button" data-go="account" data-tab-btn="account"><span class="icon" aria-hidden="true">person</span><span data-t="demo.worker.tabAccount"></span></button>
        </nav>
      </div>
    </div>
  </div>

  <script src="config.js?v=4"></script>
  <script src="demo-data.js?v=4"></script>
  <script src="script.js?v=4"></script>
</body>
</html>
